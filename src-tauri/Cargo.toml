[package]
name = "sifora-launcher"
version = "0.1.0"
description = "Sifora Launcher"
authors = ["greksaa3"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[lib]
name = "sifora_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
  "process",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-webpki-roots",
  "stream",
  "gzip",
  "json",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
parking_lot = "0.12"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 0
incremental = true
